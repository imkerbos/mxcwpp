version: "2"
linters:
  enable:
    - forbidigo
    - misspell
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(ln|f)?$
        - pattern: ^log\.(Print|Println|Printf)$
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: ^cmd/
      - linters:
          - forbidigo
        path: ^internal/deploy/cluster/
      - linters:
          - forbidigo
        path: ^internal/agent/updater/
      - linters:
          - errcheck
          - forbidigo
        path: _test\.go$
    paths:
      - deploy/data
      - deploy/data-perf
      - dist
      - tmp
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
