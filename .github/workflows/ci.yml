name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支的旧运行在有新提交时取消，节省 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 拆成独立 job 而不是一串 step，是为了避免「一处失败挡住其余全部」。
#
# 此前所有检查串在一个 job 里，顺序是 gofmt → lint → build → test。
# 结果是某次 gofmt 失败后，后面的 build 和 test 根本没执行——包括所有文档同步门禁。
# CI 因此长期显示红色，而没人知道测试到底过没过。
# 一个永远红的构建等于没有构建。
jobs:
  test:
    name: Build & Test（含文档同步门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # 文档同步门禁（internal/deploy/docs_sync_test.go）、路由清单门禁、
      # 告警覆盖门禁等都在这一步执行。它们必须独立于 lint 运行。
      - name: Test
        run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 暂设非阻塞：配置刚从 v1 迁到 v2，存量约 49 条风格类告警
      # （QF1001/QF1003/QF1008/ST1005，无正确性问题）尚未清理。
      # 清完后移除 continue-on-error，使其成为阻塞门禁。
      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  race:
    name: Race detector（非阻塞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # plugins/lib/go 存在已知 flaky race（zaptest logger 在测试结束后仍被
      # 后台 goroutine 使用，纯测试问题非生产 race）。修复该泄漏后应移除
      # continue-on-error 使其成为阻塞门禁。
      - name: Test (race)
        continue-on-error: true
        run: go test -race -short ./...

  web:
    name: Web 类型检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 前端此前完全没有 CI 覆盖：类型错误、组件测试失败都要等人本地跑才发现。
      - name: Type check
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test
