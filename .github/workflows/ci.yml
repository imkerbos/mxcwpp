name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支的旧运行在有新提交时取消，节省 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # 竞态检测暂设非阻塞：plugins/lib/go 存在已知 flaky race（zaptest logger 在测试
      # 结束后仍被后台 goroutine 使用，纯测试问题非生产 race）。修复该泄漏后应移除
      # continue-on-error 使其成为阻塞门禁。
      - name: Test (race, advisory)
        continue-on-error: true
        run: go test -race -short ./...
